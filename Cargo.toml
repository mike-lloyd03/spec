[package]
name = "spec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
cliclack = "0.3.7"
colored = "3.0.0"
directories = "6.0.0"
hex = "0.4.3"
indexmap = { version = "2.13.0", features = ["serde"] }
predicates = "3.1.3"
privesc = "1.2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_ini = "0.2.0"
serde_json = "1.0.149"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.17"
toml = "0.9.10"

[dev-dependencies]
assert_cmd = "2.1.2"
pretty_assertions = "1.4.1"
tempfile = "3.24.0"
